name: Build LibWrt JDCloud Arthur

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build:
    name: Build JDCloud RE-SS-01
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: Asia/Shanghai
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: 25.12-nss
          fetch-depth: 1


      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo docker image prune -a -f || true
          df -h


      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            ccache \
            time


      - name: Cache OpenWrt files
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: libwrt-arthur-${{ runner.os }}
          restore-keys: |
            libwrt-arthur-


      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Find Arthur device
        run: |

          echo "===== Search JDCloud device ====="

          make info | grep -i jdcloud || true

          DEVICE=$(make info | grep -i jdcloud | head -1 | awk '{print $1}')

          echo "DEVICE=$DEVICE" >> $GITHUB_ENV

          if [ -z "$DEVICE" ]; then
              echo "Cannot find JDCloud Arthur profile"
              exit 1
          fi

          echo "Selected:"
          echo "$DEVICE"


      - name: Generate configuration
        run: |

          cat > .config <<EOF

CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y

$DEVICE=y

# Chinese LuCI
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

# TUN support
CONFIG_PACKAGE_kmod-tun=y

# ccache
CONFIG_CCACHE=y

# squashfs firmware
CONFIG_TARGET_ROOTFS_SQUASHFS=y

EOF


          make defconfig


          echo "===== Target ====="

          grep TARGET_DEVICE .config || true


          echo "===== TUN ====="

          grep kmod-tun .config || true


      - name: Download source packages
        run: |
          make download -j$(nproc)

          find dl -type f -size -1024c -delete || true


      - name: Build firmware
        run: |

          echo "Start compiling..."

          make -j$(nproc) || make -j1 V=s


      - name: Show firmware
        run: |

          echo "===== Firmware list ====="

          find bin/targets \
          -type f \
          \( -name "*.bin" -o -name "*.itb" \) \
          -printf "%p %k KB\n"


      - name: Package firmware
        run: |

          mkdir firmware

          cp -f \
          $(find bin/targets \
          -type f \
          \( -name "*.bin" -o -name "*.itb" \)) \
          firmware/ || true


          cp -f bin/targets/*/*/sha256sums firmware/ || true

          cp .config firmware/build.config


      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-Arthur-firmware
          path: firmware
          retention-days: 30
