name: Build LibWrt Arthur

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JDCloud RE-SS-01 (Arthur)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 25.12-nss


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zlib1g-dev \
            ccache


      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Configure Arthur target
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          EOF

          make defconfig

          echo "===== Selected target ====="
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq60xx|qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01)=y$' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y$' .config


      - name: Download
        run: |
          make download -j$(nproc)


      - name: Build
        run: |
          make -j$(nproc) || make -j1 V=s


      - name: Collect firmware
        run: |
          mkdir -p firmware

          find bin/targets/qualcommax/ipq60xx \
          -type f \
          \( -name "*.bin" -o -name "*.itb" -o -name "*.ubi" -o -name "*.img.gz" \) \
          -exec cp {} firmware/ \;


          ls -lh firmware


      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-Arthur-firmware
          path: firmware
          if-no-files-found: error
