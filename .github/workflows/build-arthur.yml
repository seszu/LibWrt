- name: Generate Arthur config
  run: |
    cp .config .config.old 2>/dev/null || true

    make defconfig

    echo "===== Available devices ====="

    make info | grep -i jdcloud || true


    cat > .config <<'EOF'
CONFIG_TARGET_qualcommax=y
CONFIG_TARGET_qualcommax_ipq60xx=y

CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

CONFIG_CCACHE=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y
EOF


    # 自动寻找亚瑟设备配置
    DEVICE=$(make info | grep -i jdcloud | head -1 | awk '{print $1}')

    echo "Detected device:"
    echo $DEVICE


    if [ -n "$DEVICE" ]; then
        echo "$DEVICE=y" >> .config
    else
        echo "Arthur device not found"
        exit 1
    fi


    make defconfig


    echo "===== Selected profile ====="
    grep TARGET_DEVICE .config
